# Docker Compose — Combined Dashboard + Voice Agent
# Single service, supervisor manages both processes internally
# Uses consolidated Dockerfile (Dockerfile) instead of split Dockerfiles
version: '3.8'

services:
  urdu-voicebot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urdu-voicebot-combined
    environment:
      # MongoDB Atlas
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-voice_agent_db}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - MAX_BULK_CALL_NUMBERS=${MAX_BULK_CALL_NUMBERS:-25}

      # LiveKit Cloud (shared by dashboard + agent)
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - SIP_OUTBOUND_TRUNK_ID=${SIP_OUTBOUND_TRUNK_ID:-}  # Empty since no SIP trunk
      - VOICE_AGENT_NAME=${VOICE_AGENT_NAME:-urdu-voicebot}

      # Dashboard Webhook (agent posts here; supervisor ensures both services
      # share localhost so the URL is just http://localhost:8000/webhook/lead)
      - DASHBOARD_WEBHOOK_URL=http://localhost:8000/webhook/lead

      # GROQ LLM
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.6-27b}

      # Deepgram STT
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}

      # Piper TTS (model copied into image at /app/voices/)
      - PIPER_MODEL_PATH=/app/voices/ur_PK-fasih-medium.onnx

      # Cloudflare R2 (recordings archive)
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
      - CLOUDFLARE_R2_PUBLIC_URL=${CLOUDFLARE_R2_PUBLIC_URL}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3