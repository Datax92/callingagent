[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[program:dashboard]
command=exec uvicorn app:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=3
numprocs=1
process_name=%(program_name)s
stdout_logfile=/var/log/supervisor/dashboard.stdout.log
stderr_logfile=/var/log/supervisor/dashboard.stderr.log
environment=PORT=8000,PYTHONUNBUFFERED=1,PYTHONPATH=/app

[program:voice-agent]
command=python agent.py start
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=3
numprocs=1
process_name=%(program_name)s
stdout_logfile=/var/log/supervisor/voice-agent.stdout.log
stderr_logfile=/var/log/supervisor/voice-agent.stderr.log
environment=PYTHONUNBUFFERED=1,PYTHONPATH=/app,PIPER_MODEL_PATH=/app/voices/ur_PK-fasih-medium.onnx
priority=1